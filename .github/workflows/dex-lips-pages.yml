name: Publish and verify Dex_Lips tablet studio
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out exact Pages source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare complete existing site with SHA-locked vendor packages
        shell: bash
        run: bash .github/scripts/build-dex-lips-pages.sh
      - name: Browser smoke-test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/dex-lips-test-venv"
          "$RUNNER_TEMP/dex-lips-test-venv/bin/python" -m pip install --disable-pip-version-check 'playwright==1.56.0'
          command -v google-chrome
          command -v ffprobe
      - name: Real Chrome Rhubarb and H264/AAC synthetic acceptance
        shell: bash
        run: |
          "$RUNNER_TEMP/dex-lips-test-venv/bin/python" .github/scripts/smoke-dex-lips-pages.py "$RUNNER_TEMP/dex-lips-pages-site"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload full existing Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/dex-lips-pages-site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
